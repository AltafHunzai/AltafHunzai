row(360, "UI:", "HTML, CSS, Sass, Tailwind, Bootstrap", 15)
row(394, "Backend:", "PHP, Laravel, Node.js")
row(428, "Database:", "PostgreSQL, Redis")
row(462, "Tools:", "Git, GitHub, VS Code, Postman", 15)

section(510, "— Contact", 650)
row(548, "Email:", "ah5509092@gmail.com")
row(582, "LinkedIn:", "altaf-hussain-5aa663213", 15)

section(624, "— GitHub", 665)
